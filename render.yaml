services:
  - type: web
    name: nt-pulse-orchestrator
    env: node
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: ORCHESTRATION_SECRET
        value: "generate-a-long-random-string-here-12345"
      # Note: Render automatically provides RENDER_EXTERNAL_URL to the runtime,
      # so you don't need to manually define it here anymore.
